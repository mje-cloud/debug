          description: "The details of the newly-created VehicleIncidentAnswerExt"
          schema:
            $ref: "#/definitions/VehicleIncidentAnswerExtResponse"
  "/claims/{claimId}/vehicle-incidents/{incidentId}/vehicle-incident-answers-ext/{vehicleIncidentAnswerExtId}":
    parameters:
    - $ref: "#/parameters/claimId"
    - $ref: "#/parameters/incidentId"
    - $ref: "#/parameters/vehicleIncidentAnswerExtId"
    get:
      summary: "Retrieve details of a vehicle incident answer"
      description: "Retrieve details of a vehicle incident answer"
      operationId: getVehicleIncidentAnswerExt
      x-gw-extensions:
        operationType: get-element
        resourceType: VehicleIncidentAnswerExt
      x-gw-parameter-sets: get-element
      responses:
        "200":
          description: "Successful response"
          schema:
            $ref: "#/definitions/VehicleIncidentAnswerExtResponse"
    patch:
      summary: "Update a vehicle incident answer"
      description: "Update a vehicle incident answer"
      operationId: updateVehicleIncidentAnswerExt
      x-gw-extensions:
        operationType: patch-element
        resourceType: VehicleIncidentAnswerExt
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: "#/definitions/VehicleIncidentAnswerExtRequest"
      x-gw-parameter-sets: patch-element
      responses:
        "200":
          description: "Successful response"
          schema:
