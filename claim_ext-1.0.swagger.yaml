    post:
      summary: "Create a new vehicle incident answer"
      description: "Create a new vehicle incident answer"
      operationId: createVehicleIncidentAnswerExt
      x-gw-extensions:
        childResourceType: VehicleIncidentAnswerExt
        operationType: post-collection
        resourceType: VehicleIncidentAnswersExt
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: "#/definitions/VehicleIncidentAnswerExtRequest"
      x-gw-parameter-sets: post-collection
