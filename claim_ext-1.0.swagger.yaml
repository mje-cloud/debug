      description: "Delete a vehicle incident answer"
      operationId: deleteVehicleIncidentAnswerExt
      x-gw-extensions:
        operationType: delete-element
        resourceType: VehicleIncidentAnswerExt
      x-gw-parameter-sets: delete-element
      responses:
        "204":
          description: "Successful deletion"


parameters:
  answerExtId:
    name: answerExtId
    in: path
    description: "The REST identifier for the answer"
    required: true
    type: string
  digitalKickoutMessageExtId:
    name: digitalKickoutMessageExtId
    in: path
    description: "The REST identifier for the digital kickout message ext"
    required: true
    type: string
  vehicleIncidentAnswerExtId:
    name: vehicleIncidentAnswerExtId
    in: path
    description: "The REST identifier for the vehicle incident answer"
    required: true
    type: string
definitions:
  AnswerExtData:
    x-gw-extend:
    - "#/definitions/DataEnvelope"
    required:
    - attributes
    properties:
      attributes:
        $ref: "claims#/definitions/AnswerExt"
  AnswerExtList:
    type: object
    x-gw-extend:
    - "#/definitions/DataListEnvelope"
    properties:
      data:
        type: array
        items:
          $ref: "#/definitions/AnswerExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"
  AnswerExtRequest:
    type: object
    required:
      - data
    properties:
      data:
        $ref: "#/definitions/AnswerExtData"
      included:
        $ref: "#/definitions/ClaimRequestInclusions"
  AnswerExtResponse:
    type: object
    properties:
      data:
        $ref: "#/definitions/AnswerExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"
  VendorData:
      type: object
      properties:
        vendorId:
          type: string

  CreateVendorData:
    x-gw-extend:
      - "#/definitions/DataEnvelope"
    required: [ attributes ]
    properties:
      attributes:
        $ref: "#/definitions/VendorData"

  CreateVendorResponse:
    type: object
    properties:
      data:
        $ref: "#/definitions/CreateVendorData"
  ClaimRequestInclusions:
    type: object
    properties:
      AnswerExt:
        type: array
        items:
          $ref: "#/definitions/AnswerExtData"
      DigitalKickoutMessageExt:
        type: array
        items:
          $ref: "#/definitions/DigitalKickoutMessageExtData"
      VehicleIncidentAnswerExt:
        type: array
        items:
          $ref: "#/definitions/VehicleIncidentAnswerExtData"
  ClaimResponseInclusions:
    type: object
    properties:
      AnswerExt:
        type: array
        items:
          $ref: "#/definitions/AnswerExtData"
      DigitalKickoutMessageExt:
        type: array
        items:
          $ref: "#/definitions/DigitalKickoutMessageExtData"
      VehicleIncidentAnswerExt:
        type: array
        items:
          $ref: "#/definitions/VehicleIncidentAnswerExtData"
  DigitalKickoutMessageExtData:
    x-gw-extend:
    - "#/definitions/DataEnvelope"
    required:
    - attributes
    properties:
      attributes:
        $ref: "claims#/definitions/DigitalKickoutMessageExt"
  DigitalKickoutMessageExtList:
    type: object
    x-gw-extend:
    - "#/definitions/DataListEnvelope"
    properties:
      data:
        type: array
        items:
          $ref: "#/definitions/DigitalKickoutMessageExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"
  DigitalKickoutMessageExtRequest:
    type: object
    required:
    - data
    properties:
      data:
        $ref: "#/definitions/DigitalKickoutMessageExtData"
      included:
        $ref: "#/definitions/ClaimRequestInclusions"
  DigitalKickoutMessageExtResponse:
    type: object
    properties:
      data:
        $ref: "#/definitions/DigitalKickoutMessageExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"
  VehicleIncidentAnswerExtData:
    x-gw-extend:
    - "#/definitions/DataEnvelope"
    required:
    - attributes
    properties:
      attributes:
        $ref: "claims#/definitions/VehicleIncidentAnswerExt"
  VehicleIncidentAnswerExtList:
    type: object
    x-gw-extend:
    - "#/definitions/DataListEnvelope"
    properties:
      data:
        type: array
        items:
          $ref: "#/definitions/VehicleIncidentAnswerExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"
  VehicleIncidentAnswerExtRequest:
    type: object
    required:
    - data
    properties:
      data:
        $ref: "#/definitions/VehicleIncidentAnswerExtData"
      included:
        $ref: "#/definitions/ClaimRequestInclusions"
  VehicleIncidentAnswerExtResponse:
    type: object
    properties:
      data:
        $ref: "#/definitions/VehicleIncidentAnswerExtData"
      included:
        $ref: "#/definitions/ClaimResponseInclusions"